<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/street.css">
    <title>POLICE</title>
</head>
<body>

    <!-- Background mobil -->
    <div class="bungkus-street" id="bg"></div>

    <!-- Thumbnail pilihan mobil -->
    <div class="car-selector">
        <img src="../public/Polestar1.png" onclick="selectCar(0)">
        <img src="../public/Mustang1.png" onclick="selectCar(1)">
        <img src="../public/Aventador.png" onclick="selectCar(2)">
        <img src="../public/Coutach.png" onclick="selectCar(3)">
        <img src="../public/NissanR34.png" onclick="selectCar(4)">
        <img src="../public/BMWi8.png" onclick="selectCar(5)">
    </div>

    <!-- Stats mobil -->
    <div class="stats" id="stats"></div>

    <div class="actions">
        <button id="btnSelect">PILIH MOBIL INI</button>

        <div class="after-select hidden">
            <button id="btnChange">GANTI MOBIL</button>
            <button id="btnUpgrade">UPGRADE MOBIL</button>
        </div>
    </div>

    <div class="upgrade-panel hidden" id="upgradePanel">
        <h3>UPGRADE</h3>

        <div class="upgrade-item">
            <span>ENGINE</span>
            <div class="tiers">
            <button data-tier="stock">STOCK</button>
            <button data-tier="sport">SPORT</button>
            <button data-tier="pro">PRO</button>
            <button data-tier="elite">ELITE</button>
            <button data-tier="ultimate">ULTIMATE</button>
            </div>
        </div>

        <div class="upgrade-item">
            <span>TIRES</span>
            <div class="tiers">
            <button data-tier="stock">STOCK</button>
            <button data-tier="sport">SPORT</button>
            <button data-tier="pro">PRO</button>
            <button data-tier="elite">ELITE</button>
            <button data-tier="ultimate">ULTIMATE</button>
            </div>
        </div>
    </div>

    <script src="../js/street.js"></script>
</body>
</html>
